<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="minor-grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0 H0 V10" fill="none" stroke="#746c64" stroke-width="1" opacity="0.16"/>
    </pattern>
    <pattern id="major-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="url(#minor-grid)"/>
      <path d="M50 0 H0 V50" fill="none" stroke="#625b54" stroke-width="1" opacity="0.28"/>
    </pattern>
    <style>
      .word {
        fill: none;
        stroke: #2d2927;
        stroke-width: 19;
        stroke-linecap: butt;
        stroke-linejoin: round;
      }

      .chinese {
        fill: #2d2927;
        font-family: "STHeiti", "Hiragino Sans GB", sans-serif;
        font-size: 160px;
        font-weight: 300;
        letter-spacing: 4px;
      }

      .descriptor {
        fill: #2d2927;
        font-family: "Helvetica Neue", Arial, sans-serif;
        font-size: 27px;
        font-weight: 600;
        letter-spacing: 0;
      }

      .guide {
        fill: none;
        stroke: #8d433c;
        stroke-width: 1.5;
        stroke-dasharray: 7 6;
        opacity: 0.75;
      }

      .note {
        fill: #6b3733;
        font-family: "Helvetica Neue", Arial, sans-serif;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0;
      }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#aaa093"/>
  <rect x="40" y="300" width="1520" height="260" fill="url(#major-grid)"/>
  <line class="guide" x1="40" y1="360" x2="1560" y2="360"/>
  <line class="guide" x1="40" y1="430" x2="1560" y2="430"/>
  <line class="guide" x1="40" y1="500" x2="1560" y2="500"/>
  <line class="guide" x1="800" y1="300" x2="800" y2="560"/>

  <text class="note" x="45" y="348">TOP  y=360</text>
  <text class="note" x="45" y="585">OPTICAL CENTER  y=430</text>
  <text class="note" x="315" y="585">BASELINE  y=500</text>
  <text class="note" x="805" y="288">GEOMETRIC CENTER  x=800</text>
  <text class="note" x="805" y="585">MODULE 10 px / STROKE 19 px</text>

  <g transform="translate(42 360)">
    <text class="chinese" x="0" y="124">朔果</text>
    <circle cx="340" cy="73" r="7" fill="#2d2927"/>

    <g transform="translate(390 0)">
      <path class="word" d="M0 0 V140 M0 0 H48 C82 0 102 14 102 35 C102 56 82 70 48 70 H28 M38 70 H54 C92 70 114 84 114 105 C114 126 92 140 54 140 H0"/>
      <path class="word" d="M208 18 C180 22 162 46 162 78 C162 115 185 140 218 140 C251 140 274 115 274 78 C274 47 260 25 238 18"/>
      <path class="word" d="M330 15 V88 C330 120 352 140 385 140 C418 140 440 120 440 88 V15"/>
      <path class="word" d="M520 140 V58 C520 31 541 15 575 15 C609 15 630 34 630 63 V140"/>
      <path class="word" d="M730 0 V140 M690 45 H720 M740 45 H780"/>
      <path class="word" d="M850 78 H948 M958 78 C955 39 928 15 890 15 C847 15 820 42 820 78 C820 116 849 140 891 140 C919 140 941 130 958 111"/>

      <g transform="translate(1035 18)">
        <text class="descriptor" x="0" y="0">Space</text>
        <text class="descriptor" x="0" y="34">Design</text>
      </g>
    </g>
  </g>

  <rect class="guide" x="42" y="360" width="320" height="140"/>
  <line class="guide" x1="382" y1="414" x2="382" y2="452"/>
</svg>
