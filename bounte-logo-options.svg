    <text x="48" y="58" class="label">方案 02 · AXIS</text>
    <text x="48" y="94" class="note">更建筑、更直线，像平面图里的轴线与开间</text>
    <g transform="translate(54 286) scale(0.82)">
      <path class="word" d="M0 0 V136"/>
