<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2000" viewBox="0 0 2000 2000">
  <defs>
    <style>
      :root {
        --bg: #e9e3d8;
        --panel: #f4f0e8;
        --ink: #22211f;
        --muted: #777168;
        --hair: #c9c0b4;
      }

      text {
        font-family: Arial, "Helvetica Neue", sans-serif;
        letter-spacing: 0;
      }

      .page-bg { fill: var(--bg); }
      .panel { fill: var(--panel); stroke: rgba(34, 33, 31, 0.1); stroke-width: 1; }
      .label { fill: var(--muted); font-size: 22px; font-weight: 400; }
      .note { fill: var(--muted); font-size: 18px; font-weight: 400; }
      .desc { fill: var(--ink); font-size: 22px; font-weight: 400; }
      .word { fill: none; stroke: var(--ink); stroke-width: 18; stroke-linecap: butt; stroke-linejoin: round; }
      .word-round { fill: none; stroke: var(--ink); stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
      .word-thin { fill: none; stroke: var(--ink); stroke-width: 13; stroke-linecap: butt; stroke-linejoin: round; }
      .small { fill: var(--ink); font-size: 24px; font-weight: 400; }
      .guide { fill: none; stroke: var(--hair); stroke-width: 1; opacity: 0.8; }
    </style>
  </defs>

  <rect class="page-bg" width="2000" height="1600"/>
  <text x="120" y="104" class="label">BOUNTE LOGO STUDY / 字母结构方案</text>
  <text x="120" y="140" class="note">学习方向：几何字标、断口留白、空间开口、建筑秩序</text>

  <g transform="translate(120 220)">
    <rect class="panel" width="820" height="600" rx="0"/>
    <text x="48" y="58" class="label">方案 01 · OPEN COURT</text>
    <text x="48" y="94" class="note">圆形断口 + 等线宽，保留最接近参考图的克制感</text>
    <g transform="translate(54 286) scale(0.82)">
      <path class="word" d="M0 0 V126"/>
      <path class="word" d="M0 0 H54 C86 0 104 18 104 42 C104 66 84 78 52 78 H0"/>
