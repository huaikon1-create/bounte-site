<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="minor-grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0 H0 V10" fill="none" stroke="#746c64" stroke-width="1" opacity="0.16"/>
    </pattern>
    <pattern id="major-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="url(#minor-grid)"/>
      <path d="M50 0 H0 V50" fill="none" stroke="#625b54" stroke-width="1" opacity="0.28"/>
    </pattern>
    <style>
      .word {
        fill: none;
        stroke: #2d2927;
        stroke-width: 19;
        stroke-linecap: butt;
        stroke-linejoin: round;
      }

      .descriptor {
        fill: #2d2927;
        font-family: "Helvetica Neue", Arial, sans-serif;
        font-size: 27px;
        font-weight: 600;
        letter-spacing: 0;
      }

      .guide {
        fill: none;
        stroke: #8d433c;
        stroke-width: 1.5;
        stroke-dasharray: 7 6;
        opacity: 0.75;
      }

      .note {
        fill: #6b3733;
        font-family: "Helvetica Neue", Arial, sans-serif;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0;
      }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#aaa093"/>
  <rect x="200" y="300" width="1200" height="260" fill="url(#major-grid)"/>

  <line class="guide" x1="200" y1="360" x2="1400" y2="360"/>
  <line class="guide" x1="200" y1="430" x2="1400" y2="430"/>
  <line class="guide" x1="200" y1="500" x2="1400" y2="500"/>
  <line class="guide" x1="800" y1="300" x2="800" y2="560"/>

  <text class="note" x="205" y="348">TOP  y=360</text>
  <text class="note" x="205" y="585">OPTICAL CENTER  y=430</text>
  <text class="note" x="475" y="585">BASELINE  y=500</text>
  <text class="note" x="805" y="288">GEOMETRIC CENTER  x=800</text>
  <text class="note" x="805" y="585">MODULE  10 px</text>

  <g transform="translate(250 360)">
    <path class="word" d="M0 0 V140 M0 0 H48 C82 0 102 14 102 35 C102 56 82 70 48 70 H0 M0 70 H54 C92 70 114 84 114 105 C114 126 92 140 54 140 H0"/>
    <path class="word" d="M198 18 A56 60 0 1 0 238 18"/>
    <path class="word" d="M330 15 V88 C330 120 352 140 385 140 C418 140 440 120 440 88 V15"/>
    <path class="word" d="M520 140 V58 C520 31 541 15 575 15 C609 15 630 34 630 63 V140"/>
    <path class="word" d="M730 0 V140 M690 45 H770"/>
    <path class="word" d="M850 78 H958 M957 78 C954 39 928 15 890 15 C847 15 820 42 820 78 C820 116 849 140 891 140 C919 140 941 130 958 111"/>

    <g transform="translate(1035 18)">
      <text class="descriptor" x="0" y="0">Space</text>
      <text class="descriptor" x="0" y="34">Design</text>
    </g>

    <ellipse class="guide" cx="218" cy="78" rx="56" ry="60"/>
    <rect class="guide" x="0" y="0" width="114" height="140"/>
    <rect class="guide" x="330" y="15" width="110" height="125"/>
    <rect class="guide" x="520" y="15" width="110" height="125"/>
    <rect class="guide" x="820" y="15" width="138" height="125"/>
  </g>
</svg>
